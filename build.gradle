// Forge 1.20.1 构建脚本（forge-1.20.1 分支）。
// 对照主线 neoforge-1.21.1 分支：Java 包树 / 类名 / 资源布局一字不改，这里只换 Loader 与 MC 版本。
// 脚手架基准：官方 forge-1.20.1-47.4.23-mdk。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // 必须排在 ForgeGradle 之后：它要读 FG 的 reobf / runs 配置
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 的 MC 与其工具链均为 Java 17 字节码。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Jar-in-Jar：把 MixinExtras 打进成品 jar（NeoForge 内置，Forge 1.20.1 必须自带）。
// 必须在 minecraft {} 之前 enable，否则 jarJar 配置不会进最终产物。
jarJar.enable()

minecraft {
    // Parchment 叠加在 official 之上，只影响参数名 / javadoc（见 gradle.properties）。
    mappings channel: mapping_channel, version: mapping_version

    // 让 IDE 运行前自动把 processResources 输出同步到 IDE 输出目录。
    copyIdeResources = true

    // 无 access transformer：与 1.21.1 分支一样靠 mixin / 公开 API 实现。

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'
            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // 铁魔法等 fg.deobf 依赖的 mixin 注解已是 named，但 jar 内 refmap 仍指向 SRG。
            // 不重映射的话会在 userdev 里把 doLoad 映回 m_118136_ 然后炸（SimpleTextureMixin）。
            // createSrgToMcp 在 prepareRuns 阶段生成；路径与官方 Forge MDK 一致。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // 该运行配置会跑完所有已注册 gametest 后退出；没有 gametest 时会崩，属预期。
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            // 数据生成输出目录 / 既有资源目录
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Forge 1.20.1 只认 jar 清单里的 MixinConfigs（mods.toml 的 [[mixins]] 是 NeoForge 专属，会被忽略）。
// config：写入 MANIFEST.MF 的 MixinConfigs，并给所有 runs 加 -mixin.config 启动参数。
// add：编译时生成 refmap，生产环境把注入目标的 named 名映射到 SRG 名。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven {
        // Mixin 注解处理器（refmap 生成）
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "PlayerAnimator"
        url = "https://maven.kosmx.dev/"
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        // JEI（BlameJared，官方托管）
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // JEI 镜像兜底
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

// localRuntime：只用于 runClient 的开发期依赖，不会被打进本模组 jar，也不会传递给下游模组。
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 生成 ${mod_id}.refmap.json；版本对齐 Forge 47.x 内置的 Mixin 0.8.5
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Iron's Spells 'n Spellbooks — full jar（弹道 / MagicManager / DamageSources 属非 api 包）
    // fg.deobf：把发布的 SRG 成品 jar 重映射到开发环境映射。
    compileOnly fg.deobf("io.redspace:irons_spellbooks:${irons_spellbooks_version}")
    localRuntime fg.deobf("io.redspace:irons_spellbooks:${irons_spellbooks_version}")
    localRuntime fg.deobf("io.redspace:irons_lib:${irons_lib_version}")

    // Iron's Spells 的运行时依赖（编译期也需要 Curios 引用）
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    localRuntime fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    localRuntime fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")

    // 卡利亚迅剑要按刀镜像重播 PlayerAnimator 动作，编译期就要看见这些类。
    // 注意：1.20.1 线是 1.0.x，API 相对 2.0.x 差异大。
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    localRuntime fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")

    // 开发客户端工具：只进 runClient，不打进本模组 jar
    // Freecam：暂不进 localRuntime（mixin 在 parchment userdev + mixin.env.remapRefMap 下可能会炸）。
    // localRuntime "maven.modrinth:freecam:${freecam_version}"

    // MixinExtras：NeoForge 内置，Forge 1.20.1 不带。Azur 经济 mixin 依赖其 @WrapOperation 等。
    // mixinextras-forge 是 JarJar 包装 jar（编译期看不见 API），所以：
    //   * 编译 / 注解处理 → mixinextras-common
    //   * 开发 runClient + 成品 jar → jarJar(mixinextras-forge)（协商版本范围）
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// 与 1.21.1 分支的 generateModMetadata 等价，但目标改为 Forge 的 META-INF/mods.toml。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    // Windows 默认 GBK；不指定的话模板里的非 ASCII 会写成非法 UTF-8，FML 解析 mods.toml 直接炸
    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 让 jar 带上清单信息，并在打包后重混淆到 SRG（1.20.1 Forge 生产环境要求）。
// 默认对外发布的是带 MixinExtras 的 jarJar 产物（无 classifier）；
// 瘦身 jar 仅作调试，标 slim，避免玩家装到没有 MixinExtras 的版本导致 Azur mixin 炸。
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

