# Forge 1.20.1 mod metadata.
# Compared to neoforge-1.21.1 branch templates/META-INF/neoforge.mods.toml:
#   * Same modId / dependency intent; Forge uses mandatory= instead of type="required".
#   * Dependency version ranges retargeted to the 1.20.1 line.
# Expanded by processResources (${} placeholders in build.gradle).
# Keep this file ASCII-only: NightConfig reads UTF-8 and non-ASCII comments have bitten us.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="iss_elden_ring.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Player floor 1.20.1-3.16.1; 3.16.1 and 3.16.3 share the same API surface.
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[1.20.1-3.16.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Iron's Lib：本扩展不直接调用 ILIB API，只跟铁魔法本体一起加载。
    # 3.16.1 线用 lib 1.x（本体声明 <1.20.1-2）；3.16.2+ 切 Lib 2.0（如 2.1.x）。
    # 下限对齐 3.16.1 可用的 1.x，上限不封，避免挡住 2.1.x 整合包。
    modId="irons_lib"
    mandatory=true
    versionRange="[1.20.1-1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: Apotheosis 7.x on 1.20.1 (not 8.x). Armor can still take affixes via vanilla categories.
    # irons_apothic is NeoForge 1.21.1-only; its datapack lives under compat/neoforge-1.21.1-only/ on this branch.
    modId="apotheosis"
    mandatory=false
    versionRange="[7.0,)"
    ordering="AFTER"
    side="BOTH"
