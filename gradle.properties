## Iron's Spells 'n Spellbooks (1.20.1 线)
# mods.toml 里玩家下限写 [1.20.1-3.16.1,)；下面两行仅开发编译 / runClient。
# 3.16.1 与 3.16.3 无底层 API 差异，开发编译用 3.16.3 即可。
irons_spellbooks_version=1.20.1-3.16.3
irons_lib_version=1.20.1-2.1.1
geckolib_version=4.8.4
curios_version=5.14.1+1.20.1
# PlayerAnimator 1.20.1 线：相对 1.21.1 的 2.0.4 API 差异很大（卡利亚迅剑动作重接）。
player_animator_version=1.0.2-rc1+1.20
# MixinExtras：NeoForge 内置，Forge 1.20.1 不带，必须自己引。
# 6 个 Azur 经济 mixin 用了 @WrapOperation / @ModifyExpressionValue / @Local。
mixinextras_version=0.3.6

## Dev-only client utilities (runClient / localRuntime, not bundled into this mod)
# 仅开发用；缺失不阻塞编译，只是进游戏少了便利功能。
freecam_version=1.2.1+mc1.20.1
tweakerge_version=0.1.5-mc1.20.1
# MaFgLib：malilib 移植（Tweakerge 依赖）。注意 1.20.1 线为 0.1.x，比 1.21.1 的 0.4.x 旧，API 可能有差异。
# client/malilib/ 包在编译期就需要它。
mafglib_version=0.1.14-mc1.20.1
