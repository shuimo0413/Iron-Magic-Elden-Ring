# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# 反编译 MC 1.20.1 需要足够堆内存，4G 留余量。
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 跨境源抖动：Gradle 默认 socket 超时 30s，在 maven.minecraftforge.net 上偶发 "Read timed out"。
# 放宽到 120s，避免一次网络抖动就让整个 30 分钟的配置阶段报废。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 本分支（forge-1.20.1）强制 JDK 17：ForgeGradle 6 + MC 1.20.1 整条工具链是 Java 17。
# 注意：系统 PATH 里是 JDK 21，主线 neoforge-1.21.1 分支才用 21，勿互串。
org.gradle.java.home=D:/java17

## Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.23
# 正式 jar 声明的玩家下限。对齐 1.20.1 线，不绑具体 patch，避免整合包被小版本卡住。
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)

# 映射：与 1.21.1 分支一致使用 Parchment（仅参数名 / javadoc 差异，方法名与 official 相同）。
# 双分支代码参数名保持可读性一致，便于对照维护。
# 注意：ForgeGradle 的 parchment 通道要「日期-MC版本」合并写法；
# 1.21.1 分支用的 ModDevGradle 是两个独立字段（parchment_mappings_version / _minecraft_version），
# 写法不同，勿照抄，否则报 "Parchment version of ... is invalid"。
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

