pluginManagement {
    repositories {
        // 国内镜像优先（仅做加速，跨源 404 由后续仓库兜底）
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        // ForgeGradle 6 插件本体
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // Parchment 映射插件
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        // MixinGradle（org.spongepowered.mixin）：Forge 1.20.1 不认 mods.toml 的 [[mixins]]，
        // 要靠它生成 refmap 并把 MixinConfigs 写进 jar 清单 / runClient 启动参数
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // 工具链自动下载（本机已有 D:/java17，一般不会触发下载）
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}
