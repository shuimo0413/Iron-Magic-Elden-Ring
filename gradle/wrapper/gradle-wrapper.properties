distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 与官方 forge-1.20.1-47.4.23 MDK 保持一致：ForgeGradle 6 的 MCP 步骤在 Gradle 8.14 上会抛
# "project services has been closed"（ExecuteFunction 里取 Java toolchain 时项目服务已关闭），
# 必须用 MDK 钉住的 8.8。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
# 直连 services.gradle.org 慢；配合 HTTPS_PROXY 走本机代理，放宽超时更稳。
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
