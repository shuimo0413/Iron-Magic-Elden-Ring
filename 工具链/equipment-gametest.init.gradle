gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }) {
            project.sourceSets.main.java.srcDir('src/gametest/java')
            project.sourceSets.main.resources.srcDir('src/gametest/resources')
            project.tasks.named('jar').configure {
                exclude('com/eldenring/spells/EquipmentProgressionTests*.class')
                exclude('com/eldenring/spells/AzurPaymentTests*.class')
                exclude('com/eldenring/spells/item/AzurManaCostPolicyTest.class')
                exclude('data/elden_ring_spells/structure/empty.nbt')
            }
        }
    }
}
